name: Reusable Build Pipeline

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: true
        type: string
      image-name:
        description: 'Docker image name (e.g. owner/repo)'
        required: true
        type: string
      deploy-repo:
        description: 'Repo chứa config manifest (e.g. org/gitops-repo). Để trống để bỏ qua bước update.'
        required: false
        type: string
        default: ''
      helm-chart-path:
        description: 'Đường dẫn tới thư mục chứa Helm chart trong config repo (e.g. deploy)'
        required: false
        type: string
        default: 'deploy'
      values-file:
        description: 'Tên file values của Helm chart (e.g. values.yaml)'
        required: false
        type: string
        default: 'values.yaml'
      image-tag-key:
        description: 'YAML key dạng dot-notation trỏ tới image tag (e.g. image.tag)'
        required: false
        type: string
        default: 'image.tag'
    secrets:
      DEPLOY_REPO_TOKEN:
        description: 'Personal Access Token có quyền write vào deploy-repo'
        required: false

# ============================================================
# Job 1: Unit Tests (chạy song song)
# ============================================================
jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm test

  # ============================================================
  # Job 2: Lint (chạy song song)
  # ============================================================
  lint:
    name: ESLint Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ============================================================
  # Job 3: Security Scan (chạy song song)
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # - name: Run Gitleaks secret scan
      #   uses: gitleaks/gitleaks-action@v2
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

  # ============================================================
  # Job 4: Docker Build & Scan (chạy song song)
  # ============================================================
  docker-build:
    name: Docker Build & Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ inputs.image-name }}:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ inputs.image-name }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

  # ============================================================
  # Job 5: Push to GHCR (đợi tất cả 4 job trên pass)
  # ============================================================
  docker-push:
    name: Push to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: [unit-test, lint, security-scan, docker-build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ inputs.image-name }}:${{ github.sha }}
            ghcr.io/${{ inputs.image-name }}:latest

  # ============================================================
  # Job 6: Update image tag trong config/GitOps repo
  # ============================================================
  update-image-tag:
    name: Update Image Tag in Config Repo
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.event_name != 'pull_request' && inputs.deploy-repo != ''
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.deploy-repo }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: config-repo

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Update image tag in values file
        env:
          NEW_TAG: ${{ github.sha }}
        run: |
          VALUES_PATH="config-repo/${{ inputs.helm-chart-path }}/${{ inputs.values-file }}"
          echo "Updating .${{ inputs.image-tag-key }} → $NEW_TAG in $VALUES_PATH"
          yq -i '.${{ inputs.image-tag-key }} = strenv(NEW_TAG)' "$VALUES_PATH"

      - name: Commit and push changes
        run: |
          cd config-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit — image tag already up to date."
          else
            git commit -m "chore(deploy): update ${{ inputs.image-name }} image tag to ${{ github.sha }}"
            git push
          fi
